name: toddybear

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: toddybear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-toddybear}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-toddybear}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS API Container
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: toddybear-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-toddybear}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
